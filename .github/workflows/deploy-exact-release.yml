name: Deploy Recast production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: recast-worker
        run: npm install

      - name: Run tests
        working-directory: recast-worker
        run: npm test

      - name: Deploy falling-cloud-0deb
        working-directory: recast-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://tryrecast.app/"
            "https://tryrecast.app/tools/json-to-csv"
            "https://tryrecast.app/tools/csv-to-json"
            "https://tryrecast.app/automation/"
            "https://tryrecast.app/api/"
            "https://tryrecast.app/seo/"
            "https://tryrecast.app/seo/json-api-to-csv.html"
            "https://tryrecast.app/seo/automate-json-csv-conversion.html"
            "https://tryrecast.app/sitemap-seo.xml"
          )

          for url in "${urls[@]}"; do
            echo "Checking $url"
            ok=false
            for attempt in 1 2 3 4 5; do
              code=$(curl -L -sS -o /tmp/recast-check.html -w "%{http_code}" --max-time 20 "$url" || true)
              if [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
                ok=true
                break
              fi
              echo "Attempt $attempt returned HTTP $code"
              sleep 10
            done
            if [ "$ok" != "true" ]; then
              echo "Production verification failed for $url"
              exit 1
            fi
          done

          home=$(curl -L -sS --max-time 20 "https://tryrecast.app/")
          if ! grep -q 'id="pricing"' <<< "$home"; then
            echo "Production verification failed: homepage pricing section not found"
            exit 1
          fi

          seo_page=$(curl -L -sS --max-time 20 "https://tryrecast.app/seo/json-api-to-csv.html")
          if ! grep -qi '<link rel="canonical"' <<< "$seo_page"; then
            echo "Production verification failed: SEO page canonical not found"
            exit 1
          fi

          seo_sitemap=$(curl -L -sS --max-time 20 "https://tryrecast.app/sitemap-seo.xml")
          if ! grep -q 'https://tryrecast.app/seo/' <<< "$seo_sitemap"; then
            echo "Production verification failed: SEO sitemap has no SEO URLs"
            exit 1
          fi

          echo "Production verification passed."
