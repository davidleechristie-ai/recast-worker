name: Deploy Recast production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: recast-worker
        run: npm install

      - name: Run tests
        working-directory: recast-worker
        run: npm test

      - name: Deploy falling-cloud-0deb
        working-directory: recast-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://tryrecast.app/"
            "https://tryrecast.app/tools/json-to-csv"
            "https://tryrecast.app/tools/csv-to-json"
            "https://tryrecast.app/pricing"
          )

          for url in "${urls[@]}"; do
            echo "Checking $url"
            ok=false
            for attempt in 1 2 3 4 5; do
              code=$(curl -L -sS -o /tmp/recast-check.html -w "%{http_code}" --max-time 20 "$url" || true)
              if [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
                ok=true
                break
              fi
              echo "Attempt $attempt returned HTTP $code"
              sleep 10
            done
            if [ "$ok" != "true" ]; then
              echo "Production verification failed for $url"
              exit 1
            fi
          done

          echo "Production verification passed."
