name: Deploy Recast production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: recast-worker
        run: npm install

      - name: Run tests
        working-directory: recast-worker
        run: npm test

      - name: Deploy falling-cloud-0deb
        working-directory: recast-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://tryrecast.app/"
            "https://tryrecast.app/tools/"
            "https://tryrecast.app/tools/json-to-csv.html"
            "https://tryrecast.app/tools/csv-to-json.html"
            "https://tryrecast.app/tools/csv-diff.html"
            "https://tryrecast.app/tools/json-diff.html"
            "https://tryrecast.app/tools/compare-csv-files-by-id.html"
            "https://tryrecast.app/tools/api-response-to-csv.html"
            "https://tryrecast.app/tools/compare-api-responses.html"
            "https://tryrecast.app/automation/"
            "https://tryrecast.app/api/"
            "https://tryrecast.app/sitemap.xml"
          )

          for url in "${urls[@]}"; do
            echo "Checking $url"
            ok=false
            for attempt in 1 2 3 4 5; do
              code=$(curl -L -sS -o /tmp/recast-check.html -w "%{http_code}" --max-time 20 "$url" || true)
              if [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
                ok=true
                break
              fi
              echo "Attempt $attempt returned HTTP $code"
              sleep 10
            done
            if [ "$ok" != "true" ]; then
              echo "Production verification failed for $url"
              exit 1
            fi
          done

          home=$(curl -L -sS --max-time 20 "https://tryrecast.app/")
          if ! grep -q 'id="pricing"' <<< "$home"; then
            echo "Production verification failed: homepage pricing section not found"
            exit 1
          fi

          tools=$(curl -L -sS --max-time 20 "https://tryrecast.app/tools/")
          if ! grep -q '<link rel="canonical" href="https://tryrecast.app/tools/"' <<< "$tools"; then
            echo "Production verification failed: tools hub canonical is not /tools/"
            exit 1
          fi
          if ! grep -q '<meta property="og:url" content="https://tryrecast.app/tools/"' <<< "$tools"; then
            echo "Production verification failed: tools hub og:url is not /tools/"
            exit 1
          fi
          if ! grep -q 'seo-authority-cluster' <<< "$tools"; then
            echo "Production verification failed: tools hub authority cluster missing"
            exit 1
          fi

          csv_diff=$(curl -L -sS --max-time 20 "https://tryrecast.app/tools/csv-diff.html")
          if ! grep -q '/tools/compare-csv-files-by-id.html' <<< "$csv_diff"; then
            echo "Production verification failed: CSV Diff does not link to Compare CSV Files by ID"
            exit 1
          fi

          json_diff=$(curl -L -sS --max-time 20 "https://tryrecast.app/tools/json-diff.html")
          if ! grep -q '/tools/compare-api-responses.html' <<< "$json_diff"; then
            echo "Production verification failed: JSON Diff does not link to Compare API Responses"
            exit 1
          fi

          json_csv=$(curl -L -sS --max-time 20 "https://tryrecast.app/tools/json-to-csv.html")
          if ! grep -q '/tools/api-response-to-csv.html' <<< "$json_csv"; then
            echo "Production verification failed: JSON to CSV does not link to API Response to CSV"
            exit 1
          fi

          sitemap=$(curl -L -sS --max-time 20 "https://tryrecast.app/sitemap.xml")
          if grep -q 'https://tryrecast.app/seo/' <<< "$sitemap"; then
            echo "Production verification failed: stale /seo/ URLs remain in sitemap"
            exit 1
          fi
          for required in \
            'https://tryrecast.app/tools/compare-csv-files-by-id.html' \
            'https://tryrecast.app/tools/api-response-to-csv.html' \
            'https://tryrecast.app/tools/compare-api-responses.html'; do
            if ! grep -q "$required" <<< "$sitemap"; then
              echo "Production verification failed: sitemap missing $required"
              exit 1
            fi
          done

          echo "Production verification passed."
