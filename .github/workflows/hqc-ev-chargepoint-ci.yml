name: HQC EV chargepoint CI
on:
  push:
    branches: [main]
    paths:
      - 'hqc-deploy-preview/lib/ev-chargepoint-extraction.js'
      - 'hqc-deploy-preview/lib/ev-chargepoint-analysis.js'
      - 'hqc-deploy-preview/test/ev-chargepoint-analysis.test.mjs'
      - 'hqc-deploy-preview/lib/ev-chargepoint-request-handler.js'
      - 'hqc-deploy-preview/test/ev-chargepoint-request-handler.test.mjs'
      - 'hqc-deploy-preview/test/worker-entry-ev-gate.test.mjs'
      - 'hqc-deploy-preview/worker-entry.js'
      - 'hqc-deploy-preview/test/ev-chargepoint-extraction.test.mjs'
      - 'hqc-deploy-preview/test/fixtures/ev-chargepoint-cases.json'
      - '.github/workflows/hqc-ev-chargepoint-ci.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hqc-deploy-preview/test/ev-chargepoint-extraction.test.mjs hqc-deploy-preview/test/ev-chargepoint-analysis.test.mjs hqc-deploy-preview/test/ev-chargepoint-request-handler.test.mjs hqc-deploy-preview/test/worker-entry-ev-gate.test.mjs
