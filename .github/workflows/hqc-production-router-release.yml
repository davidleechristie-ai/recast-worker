name: HQC production router release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hqc-production-router-release.yml'
      - 'hqc-deploy-preview/worker.js'
      - 'hqc-deploy-preview/worker-entry.js'
      - 'hqc-deploy-preview/lib/technology-routing.js'
      - 'hqc-deploy-preview/lib/analysis-request-routing.js'
      - 'hqc-deploy-preview/wrangler.production.toml'
      - 'hqc-deploy-preview/approved-home-layout.js'
      - 'hqc-deploy-preview/snapshot.mjs'
      - 'hqc-deploy-preview/solar-preview-journey.js'
      - 'hqc-deploy-preview/ev-chargepoint-preview-journey.js'
      - 'hqc-deploy-preview/lib/ev-chargepoint-*.js'
      - 'hqc-deploy-preview/upload-friction-v3.js'
      - 'hqc-deploy-preview/intake-diagnostics.js'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hqc-production-router
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: hqc-deploy-preview
        run: npm install
      - name: Test technology evidence and routing
        working-directory: hqc-deploy-preview
        run: |
          node --test solar-evidence-model.test.js test/solar-battery-extraction.test.mjs
          node --test test/technology-routing.test.mjs test/analysis-request-routing.test.mjs
          node --test test/intake-diagnostics.test.mjs
          node --test test/decision-pack-technology.test.mjs test/renewable-decision-pack-boundary.test.mjs
          node --test test/ev-durable-completion.test.mjs
          node --test test/ev-decision-brief.test.mjs
          node --test test/ev-chargepoint-extraction.test.mjs test/ev-chargepoint-analysis.test.mjs test/ev-chargepoint-request-handler.test.mjs test/ev-upload-boundary.test.mjs test/worker-entry-ev-gate.test.mjs
      - name: Require same-commit custom-domain canary before shared payment release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            state=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=30" --jq '[.workflow_runs[] | select(.name=="HQC custom-domain canary")][0] | (.conclusion // .status // "queued")')
            echo "Same-commit canary: $state (attempt $attempt)"
            if [ "$state" = success ]; then exit 0; fi
            if [ "$state" = failure ] || [ "$state" = cancelled ]; then exit 1; fi
            sleep 5
          done
          echo 'Timed out waiting for same-commit custom-domain canary'
          exit 1
      - name: Snapshot production frontend before Worker release
        working-directory: hqc-deploy-preview
        env:
          HQC_PUBLIC_ORIGIN: https://homequotecheck.co.uk
        run: node snapshot.mjs
      - name: Deploy production Worker with static asset binding intact
        working-directory: hqc-deploy-preview
        run: npx wrangler deploy -c wrangler.production.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production Heat Pump compatibility and Solar MVP
        shell: bash
        run: |
          set -euo pipefail
          base='https://homequotecheck.co.uk'
          ok=false
          for attempt in 1 2 3 4 5; do
            health=$(curl -L -sS --max-time 30 "$base/health" || true)
            if grep -q '"environment":"production"' <<< "$health" && grep -q '"durableMetrics":true' <<< "$health"; then ok=true; break; fi
            echo "Awaiting production Worker (attempt $attempt): $health"
            sleep 5
          done
          test "$ok" = 'true'

          hp_code=$(curl -L -sS -o /tmp/hqc-hp -w '%{http_code}' --max-time 30 "$base/api/_healthcheck")
          echo "heat-pump/default health -> $hp_code"
          test "$hp_code" = '200'
          grep -q 'Success' /tmp/hqc-hp

          solar_code=$(curl -L -sS -o /tmp/hqc-solar -w '%{http_code}' --max-time 30 -X POST -H 'content-type: application/json' -H 'x-hqc-technology: solar_battery' --data '{"extractedMedia":{"sourceMediaType":"application/pdf","extractionMethod":"release-smoke-text-v1","pageCount":1,"extractedText":"Solar PV quote: 12 x 425W panels, 5.1 kWp array. Inverter 5 kW. Total price £9,500."}}' "$base/api/analyse")
          echo "solar production analysis -> $solar_code"
          test "$solar_code" = '200'
          grep -q '5.1' /tmp/hqc-solar

          for technology in solar_battery battery ev_chargepoint; do
            pack_code=$(curl -L -sS -o /tmp/hqc-renewable-pack -w '%{http_code}' --max-time 30 -X POST -H 'content-type: application/json' --data "{\"caseId\":\"release-guard-123456\",\"technology\":\"$technology\"}" "$base/api/decision-pack/checkout")
            echo "$technology Decision Pack boundary -> $pack_code"
            test "$pack_code" = '409'
            grep -q '"error":"decision_pack_unavailable_for_technology"' /tmp/hqc-renewable-pack
          done

          ev_code=$(curl -L -sS -o /tmp/hqc-ev -w '%{http_code}' --max-time 30 -X POST -H 'content-type: application/json' -H 'x-hqc-technology: ev_chargepoint' --data '{"quoteText":"Installation of Zappi V2 EV charger 7.4 kW charging. Total £1,250."}' "$base/api/analyse")
          echo "EV closed production gate -> $ev_code"
          test "$ev_code" = '409'
          grep -q '"technology":"ev_chargepoint"' /tmp/hqc-ev

          metrics_code=$(curl -L -sS -o /tmp/hqc-metrics -w '%{http_code}' --max-time 30 "$base/api/metrics")
          echo "durable metrics -> $metrics_code"
          test "$metrics_code" = '200'
          grep -q '"durable":true' /tmp/hqc-metrics

          growth_code=$(curl -L -sS -o /tmp/hqc-growth -w '%{http_code}' --max-time 30 "$base/api/growth-report")
          echo "durable growth report -> $growth_code"
          test "$growth_code" = '200'
          grep -q '"evAnalyses":' /tmp/hqc-growth
          grep -q '"evComparisons":' /tmp/hqc-growth

          intake_ready=false
          for attempt in 1 2 3 4 5 6; do
            home=$(curl -L -sS --max-time 30 "$base/?release_probe=$attempt" || true)
            script=$(curl -L -sS --max-time 30 "$base/__hqc_intake_diagnostics.js?release_probe=$attempt" || true)
            ev_script=$(curl -L -sS --max-time 30 "$base/__hqc_ev_preview.js?release_probe=$attempt" || true)
            intake=$(curl -L -sS --max-time 30 -X POST -H 'content-type: application/json' -H "referer: $base/?qa=1" --data '{"event":"intake_file_selected","technology":"heat_pump","source":"release_smoke"}' "$base/api/event" || true)
            if grep -q '__hqc_intake_diagnostics.js' <<< "$home" && grep -q 'intake_file_selected' <<< "$script" && grep -q 'Compare quote evidence' <<< "$ev_script" && grep -q '"test":true' <<< "$intake"; then intake_ready=true; break; fi
            echo "Awaiting production intake asset and excluded QA event (attempt $attempt)"
            sleep 5
          done
          test "$intake_ready" = 'true'

          echo 'HQC production technology-router verification passed.'
