name: HQC commercial metrics

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hqc-commercial-metrics.yml'

permissions:
  contents: write

concurrency:
  group: hqc-commercial-metrics
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch authoritative durable production funnel
        shell: bash
        run: |
          set -euo pipefail
          base='https://homequotecheck.co.uk'
          metrics=$(mktemp)
          growth=$(mktemp)
          curl -fsS --max-time 30 "$base/api/metrics" -o "$metrics"
          curl -fsS --max-time 30 "$base/api/growth-report" -o "$growth"
          jq -e '.durable == true and (.measurementStartedAt|length)>0' "$metrics" >/dev/null
          jq -e '.durable == true and (.measurementStartedAt|length)>0' "$growth" >/dev/null
          jq -n \
            --arg fetchedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile metrics "$metrics" \
            --slurpfile growth "$growth" \
            '{
              fetchedAt:$fetchedAt,
              durable:true,
              measurementStartedAt:$metrics[0].measurementStartedAt,
              northStar:{
                genuineAnalyses:{current:$metrics[0].genuineAnalyses,target:100},
                shareOpens:{current:$metrics[0].shareOpens,target:20},
                outboundActions:{current:$metrics[0].outboundClicks,target:10},
                note:"Cumulative Cloudflare-side validation counters. QA/demo/test traffic is excluded; payment intent is not treated as revenue."
              },
              total:$growth[0].total,
              sources:$growth[0].sources,
              recommendations:$growth[0].recommendations,
              decision:(
                if $metrics[0].genuineAnalyses >= 100 then
                  {priority:"validation review",action:"Perform SCALE/HOLD/PIVOT review before further autonomous growth changes."}
                elif ($growth[0].total.uploads > 0 and $growth[0].total.genuine == 0) then
                  {priority:"analysis completion",action:"Fix submission-to-analysis friction before acquisition expansion."}
                elif ($growth[0].total.cta >= 5 and $growth[0].total.uploads == 0) then
                  {priority:"quote intake",action:"Fix checker-start-to-upload friction before adding acquisition."}
                elif ($growth[0].total.landings >= 15 and $growth[0].total.cta == 0) then
                  {priority:"landing conversion",action:"Improve message match and CTA clarity on existing qualified pages before adding acquisition."}
                elif ($growth[0].total.genuine > 0 and $growth[0].total.shareOpens == 0) then
                  {priority:"share evidence",action:"Keep measuring the Decision Case share path; strengthen it only after enough genuine analyses establish a repeatable gap."}
                else
                  {priority:"measure",action:"Clean durable sample is still small. Avoid speculative feature churn and keep measuring the full funnel."}
                end
              )
            }' > hqc-ops/commercial-live.json
          cat hqc-ops/commercial-live.json
      - name: Persist snapshot safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hqc-growth-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add hqc-ops/commercial-live.json
          git diff --cached --quiet && exit 0
          git commit -m 'HQC: snapshot durable commercial metrics'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
