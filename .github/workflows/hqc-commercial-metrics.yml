name: HQC commercial metrics

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hqc-commercial-metrics.yml'

permissions:
  contents: write

concurrency:
  group: hqc-commercial-metrics
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch authoritative durable production funnel
        shell: bash
        run: |
          set -euo pipefail
          base='https://homequotecheck.co.uk'
          metrics=$(mktemp)
          growth=$(mktemp)
          curl -fsS --max-time 30 "$base/api/metrics" -o "$metrics"
          curl -fsS --max-time 30 "$base/api/growth-report" -o "$growth"
          jq -e '.durable == true and (.measurementStartedAt|length)>0' "$metrics" >/dev/null
          jq -e '.durable == true and (.measurementStartedAt|length)>0' "$growth" >/dev/null
          jq -n \
            --arg fetchedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile metrics "$metrics" \
            --slurpfile growth "$growth" \
            '{
              fetchedAt:$fetchedAt,
              durable:true,
              measurementStartedAt:$metrics[0].measurementStartedAt,
              northStar:{
                genuineAnalyses:{current:$metrics[0].genuineAnalyses,target:100},
                shareOpens:{current:$metrics[0].shareOpens,target:20},
                outboundActions:{current:$metrics[0].outboundClicks,target:10},
                note:"Cumulative Cloudflare-side validation counters. QA/demo/test traffic is excluded; payment intent is not treated as revenue."
              },
              total:$growth[0].total,
              sources:$growth[0].sources,
              recommendations:$growth[0].recommendations,
              decision:(
                if $metrics[0].genuineAnalyses >= 100 then
                  {priority:"validation review",action:"Perform SCALE/HOLD/PIVOT review before further autonomous growth changes."}
                elif $growth[0].total.landings >= 15 and (($growth[0].total.cta / $growth[0].total.landings) < 0.30) then
                  {priority:"landing conversion",action:"Improve message match, trust proof and CTA clarity on existing qualified pages before adding acquisition."}
                elif $growth[0].total.cta >= 5 and (($growth[0].total.uploads / $growth[0].total.cta) < 0.50) then
                  {priority:"quote intake",action:"Reduce checker-start-to-upload friction before adding acquisition."}
                elif $growth[0].total.uploads >= 3 and $growth[0].total.genuine == 0 then
                  {priority:"analysis completion",action:"Fix submission-to-analysis friction before acquisition expansion."}
                elif $growth[0].total.extendedGenuine >= 5 and (($growth[0].total.multiQuoteAnalyses / $growth[0].total.extendedGenuine) < 0.40) then
                  {priority:"multi-quote progression",action:"Strengthen genuine analysis to second-quote progression before expanding acquisition."}
                elif $growth[0].total.extendedGenuine >= 5 and (($growth[0].total.decisionCases / $growth[0].total.extendedGenuine) < 0.80) then
                  {priority:"Decision Case completion",action:"Fix the genuine-analysis-to-Decision-Case handoff before optimising sharing."}
                elif $growth[0].total.decisionCases >= 5 and (($growth[0].total.shareIntent / $growth[0].total.decisionCases) < 0.20) then
                  {priority:"share progression",action:"Improve the privacy-safe installer-question and share handoff."}
                elif $growth[0].total.shareOpens >= 5 and (($growth[0].total.recipientStarts / $growth[0].total.shareOpens) < 0.20) then
                  {priority:"recipient conversion",action:"Improve the shared-case recipient handoff into their own quote check."}
                elif $growth[0].total.genuine >= 10 and (($growth[0].total.outboundClicks / $growth[0].total.genuine) < 0.10) then
                  {priority:"commercial intent",action:"Improve clearly separated installer-finding intent without influencing comparison results."}
                elif $growth[0].total.landings >= 15 and ([ $growth[0].sources[] | select((.source|startswith("organic_")) and .genuine > 0) ] | length) == 0 then
                  {priority:"qualified organic acquisition",action:"Improve existing high-intent decision pages and internal handoff before adding new acquisition pages."}
                else
                  {priority:"measure",action:"Clean durable sample is still below decision thresholds. Avoid speculative feature churn and keep measuring the full funnel."}
                end
              )
            }' > hqc-ops/commercial-live.json
          cat hqc-ops/commercial-live.json
      - name: Persist snapshot safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hqc-growth-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add hqc-ops/commercial-live.json
          git diff --cached --quiet && exit 0
          git commit -m 'HQC: snapshot durable commercial metrics'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
