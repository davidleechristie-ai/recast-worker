name: HQC live metrics snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hqc-live-metrics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch production HQC metrics
        shell: bash
        run: |
          set -euo pipefail
          base='https://api-v2.appdeploy.ai/app/heat-pump-second-opinion-v43csv'
          metrics=$(mktemp)
          growth=$(mktemp)
          mkdir -p hqc-ops
          curl -fsS --max-time 30 "$base/api/metrics" -o "$metrics"
          curl -fsS --max-time 30 "$base/api/growth-report" -o "$growth"
          jq -n \
            --arg fetchedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile metrics "$metrics" \
            --slurpfile growth "$growth" \
            --slurpfile baseline hqc-ops/validation-baseline.json \
            '{
              fetchedAt:$fetchedAt,
              metrics:$metrics[0],
              growthReport:$growth[0],
              authoritativeSinceBaseline:{
                baselineAt:$baseline[0].baselineAt,
                landings:($growth[0].total.landings-$baseline[0].total.landings),
                cta:($growth[0].total.cta-$baseline[0].total.cta),
                uploads:($growth[0].total.uploads-$baseline[0].total.uploads),
                genuine:($growth[0].total.genuine-$baseline[0].total.genuine),
                shareIntent:($growth[0].total.shareIntent-$baseline[0].total.shareIntent),
                shareOpens:($growth[0].total.shareOpens-$baseline[0].total.shareOpens),
                checkouts:($growth[0].total.checkouts-$baseline[0].total.checkouts)
              }
            }' \
            > hqc-ops/live-metrics.json
          jq . hqc-ops/live-metrics.json
      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hqc-growth-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add hqc-ops/live-metrics.json
          if git diff --cached --quiet; then
            echo 'No metric change to commit.'
            exit 0
          fi
          git commit -m 'HQC: snapshot live validation metrics'
          git push
