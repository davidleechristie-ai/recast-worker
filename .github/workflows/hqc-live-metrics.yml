name: HQC live metrics snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hqc-live-metrics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch production HQC metrics
        shell: bash
        run: |
          set -euo pipefail
          base='https://api-v2.appdeploy.ai/app/heat-pump-second-opinion-v43csv'
          echo '--- /api/metrics ---'
          curl -fsS --max-time 30 "$base/api/metrics" | jq .
          echo '--- /api/growth-report ---'
          curl -fsS --max-time 30 "$base/api/growth-report" | jq .
          echo '--- event payload scan ---'
          site='https://heat-pump-second-opinion-v43csv.v2.appdeploy.ai'
          js=$(mktemp)
          curl -fsS --max-time 30 "$site/assets/index-CbjepCsd.js" -o "$js"
          python - "$js" <<'PY'
          import sys
          s=open(sys.argv[1],encoding='utf-8').read()
          needle='/api/event'
          start=0
          for i in range(8):
            p=s.find(needle,start)
            if p<0: break
            print(s[max(0,p-900):p+1400])
            print('\n--- occurrence ---\n')
            start=p+len(needle)
          PY
          echo 'snapshot=2026-09-09T00:26:54+01:00'
