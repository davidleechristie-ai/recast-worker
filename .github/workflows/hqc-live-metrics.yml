name: HQC live metrics snapshot

on:
  schedule:
    - cron: '27 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/hqc-live-metrics.yml'
  workflow_run:
    workflows: ['HQC production router release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hqc-live-metrics
  cancel-in-progress: true

jobs:
  metrics:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch durable production HQC metrics
        shell: bash
        run: |
          set -euo pipefail
          base='https://homequotecheck.co.uk'
          metrics=$(mktemp)
          growth=$(mktemp)
          mkdir -p hqc-ops
          curl -fsS --max-time 30 "$base/api/metrics" -o "$metrics"
          curl -fsS --max-time 30 "$base/api/growth-report" -o "$growth"
          jq -e '.durable == true and (.measurementStartedAt|length)>0 and (.extendedMeasurementStartedAt|length)>0' "$metrics" >/dev/null
          jq -e '.durable == true and (.measurementStartedAt|length)>0 and (.extendedMeasurementStartedAt|length)>0' "$growth" >/dev/null
          jq -n \
            --arg fetchedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile metrics "$metrics" \
            --slurpfile growth "$growth" \
            '{
              fetchedAt:$fetchedAt,
              metrics:$metrics[0],
              growthReport:$growth[0]
            }
            | . as $r
            | .autonomousDecisionGate = (
                if $r.metrics.genuineAnalyses >= 100 then
                  {status:"SCALE_HOLD_PIVOT_REVIEW", bottleneck:"validation threshold reached", action:"Perform SCALE/HOLD/PIVOT review before further autonomous growth changes."}
                elif $r.growthReport.total.singleStarts >= 5 and (($r.growthReport.total.pickerOpens / $r.growthReport.total.singleStarts) < 0.70) then
                  {status:"ACT", bottleneck:"quote-check start -> file picker", action:"Reduce the extra interaction between starting a quote check and opening the file picker. Keep privacy reassurance adjacent to the upload action."}
                elif $r.growthReport.total.pickerOpens >= 5 and (($r.growthReport.total.fileSelections / $r.growthReport.total.pickerOpens) < 0.70) then
                  {status:"ACT", bottleneck:"file picker -> file selected", action:"Clarify supported formats and mobile photo/PDF selection. Do not add acquisition while users are abandoning the picker."}
                elif $r.growthReport.total.fileSelections >= 3 and (($r.growthReport.total.uploadHandoffs / $r.growthReport.total.fileSelections) < 0.90) then
                  {status:"ACT", bottleneck:"file selected -> upload handoff", action:"Fix the file-selection handoff before changing results or acquisition."}
                elif $r.growthReport.total.uploadHandoffs >= 3 and (($r.growthReport.total.analysisReady / $r.growthReport.total.uploadHandoffs) < 0.90) then
                  {status:"ACT", bottleneck:"upload handoff -> analysis ready", action:"Fix the post-upload transition into analysis; preserve evidence guardrails."}
                elif $r.growthReport.total.analysisReady >= 3 and (($r.growthReport.total.analysisAutoStarts / $r.growthReport.total.analysisReady) < 0.90) then
                  {status:"ACT", bottleneck:"analysis ready -> analysis start", action:"Remove avoidable analysis confirmation friction for single-quote checks."}
                elif $r.growthReport.total.analysisAutoStarts >= 3 and (($r.growthReport.total.resultVisible / $r.growthReport.total.analysisAutoStarts) < 0.85) then
                  {status:"ACT", bottleneck:"analysis start -> visible result", action:"Prioritise analysis reliability and error recovery before acquisition or monetisation changes."}
                elif $r.growthReport.total.resultViews >= 10 and (($r.growthReport.total.installerAlternativeInterest / $r.growthReport.total.resultViews) >= 0.15) then
                  {status:"ACT", bottleneck:"validated installer-alternative demand", action:"Run a small consent-based manual installer introduction pilot before building marketplace automation."}
                elif $r.growthReport.total.resultViews >= 10 and (($r.growthReport.total.installerAlternativeInterest / $r.growthReport.total.resultViews) < 0.15) then
                  {status:"HOLD", bottleneck:"weak installer-alternative demand", action:"Do not build an installer marketplace. Keep focus on independent checking and quote comparison."}
                elif $r.growthReport.total.extendedGenuine >= 5 and (($r.growthReport.total.multiQuoteAnalyses / $r.growthReport.total.extendedGenuine) < 0.40) then
                  {status:"ACT", bottleneck:"genuine analysis -> second quote/comparison", action:"Strengthen multi-quote progression without changing evidence or design-certification guardrails."}
                else
                  {status:"HOLD", bottleneck:"insufficient clean post-redesign sample", action:"Do not churn production. Continue measurement until the new Upload -> Check -> Answer funnel has enough genuine activity to identify a justified change."}
                end
              )
            ' > hqc-ops/live-metrics.json
          jq . hqc-ops/live-metrics.json
      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hqc-growth-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add hqc-ops/live-metrics.json
          if git diff --cached --quiet; then
            echo 'No metric change to commit.'
            exit 0
          fi
          git commit -m 'HQC: snapshot durable validation metrics'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
