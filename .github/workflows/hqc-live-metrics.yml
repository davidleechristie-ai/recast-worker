name: HQC live metrics snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hqc-live-metrics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch production HQC metrics
        shell: bash
        run: |
          set -euo pipefail
          base='https://api-v2.appdeploy.ai/app/heat-pump-second-opinion-v43csv'
          echo '--- /api/metrics ---'
          curl -fsS --max-time 30 "$base/api/metrics" | jq .
          echo '--- /api/growth-report ---'
          curl -fsS --max-time 30 "$base/api/growth-report" | jq .
          echo '--- instrumentation scan ---'
          site='https://heat-pump-second-opinion-v43csv.v2.appdeploy.ai'
          html=$(mktemp)
          curl -fsS --max-time 30 "$site/" -o "$html"
          grep -Eo '(src|href)="[^"]+"' "$html" | grep -E '/assets/.*\.js' | head -20 || true
          for p in $(grep -Eo 'src="[^"]+\.js"' "$html" | sed -E 's/^src="|"$//g'); do
            case "$p" in http*) u="$p";; /*) u="$site$p";; *) u="$site/$p";; esac
            echo "asset=$u"
            curl -fsS --max-time 30 "$u" | grep -Eo '/api/[A-Za-z0-9_?&=./:-]+' | sort -u | grep -E 'growth|metric|event|track|share|upload|analysis' || true
          done
          echo 'snapshot=2026-09-09T00:26:54+01:00'
