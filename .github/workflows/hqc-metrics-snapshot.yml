name: HQC North Star metrics snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hqc-metrics-snapshot.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Read production North Star metrics
        shell: bash
        run: |
          set -euo pipefail
          base='https://homequotecheck.co.uk'
          mkdir -p hqc-metrics
          curl -fsSL --max-time 30 "$base/api/metrics" | tee hqc-metrics/metrics.json
          echo
          curl -fsSL --max-time 30 "$base/api/growth-report" | tee hqc-metrics/growth-report.json
          echo
          python - <<'PY'
          import json
          m=json.load(open('hqc-metrics/metrics.json'))
          g=json.load(open('hqc-metrics/growth-report.json'))
          print('NORTH_STAR_METRICS')
          for k in ('genuineAnalyses','shareOpens','outboundClicks'):
              print(f'{k}={m.get(k)}')
          print('VALIDATION_TARGETS', json.dumps(m.get('validationTargets',{}), sort_keys=True))
          print('GROWTH_RECOMMENDATION', g.get('recommendation'))
          print('SOURCE_FUNNELS', json.dumps(g.get('sources',[]), sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hqc-north-star-metrics
          path: hqc-metrics/
          retention-days: 30
