name: ScrapSignal Cloudflare bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scrapsignal-cloudflare-bridge.yml'
      - 'scrapsignal-preview/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrapsignal-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate product assets
        run: |
          node --check scrapsignal-preview/site/dashboard.js
          node --check scrapsignal-preview/site/live-signals.js
          grep -q 'Opportunity feed' scrapsignal-preview/site/dashboard-demo.html
          grep -q 'Validated signals from the monitored register' scrapsignal-preview/site/live-signals.js
          grep -q 'Mids Auto Services Limited' scrapsignal-preview/site/signals.json
          grep -q 'Mytum and Selby (Goole) Ltd' scrapsignal-preview/site/signals.json
          grep -q 'Quality first' scrapsignal-preview/site/new-waste-sites-september-2026.html
      - name: Install
        working-directory: scrapsignal-preview
        run: npm install
      - name: Deploy ScrapSignal preview worker
        working-directory: scrapsignal-preview
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify ScrapSignal production
        shell: bash
        run: |
          set -euo pipefail
          base='https://scrapsignal-preview.davidleechristie.workers.dev'
          check(){ local label="$1" body="$2" marker="$3"; if ! grep -q "$marker" <<< "$body"; then echo "VERIFY FAILED: $label missing marker: $marker"; echo "Response preview: ${body:0:500}"; exit 1; fi; echo "verified: $label"; }
          health=$(curl -L -sS --max-time 30 "$base/health")
          check health "$health" 'scrapsignal-preview'
          home=$(curl -L -sS --max-time 30 "$base/")
          check homepage "$home" 'Find businesses that may be'
          dashboard=$(curl -L -sS --max-time 30 "$base/dashboard-demo")
          check dashboard "$dashboard" 'Opportunity feed'
          check dashboard-live-injection "$dashboard" 'live-signals.js'
          signals=$(curl -L -sS --max-time 30 "$base/signals.json")
          check signals-one "$signals" 'Mids Auto Services Limited'
          check signals-two "$signals" 'Mytum and Selby (Goole) Ltd'
          signalpage=$(curl -L -sS --max-time 30 "$base/signals/new-waste-sites-september-2026")
          check public-signal-page "$signalpage" 'New licensed sites our monitor detected'
          check public-signal-proof "$signalpage" 'Mids Auto Services Limited'
          livejs=$(curl -L -sS --max-time 30 "$base/live-signals.js")
          check live-feed-renderer "$livejs" 'Validated signals from the monitored register'
          status=$(curl -L -sS --max-time 30 "$base/status.json")
          check validation-state "$status" 'WAIT_FOR_MORE_EVIDENCE'
          check quality-gate "$status" 'quality_gate'
          echo 'ScrapSignal quality-gated product production verification passed.'
