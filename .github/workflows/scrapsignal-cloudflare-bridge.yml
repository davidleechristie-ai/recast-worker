name: ScrapSignal Cloudflare bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scrapsignal-cloudflare-bridge.yml'
      - 'scrapsignal-preview/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrapsignal-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate product assets
        run: |
          node --check scrapsignal-preview/worker.js
          node --check scrapsignal-preview/billing.js
          node --check scrapsignal-preview/site/dashboard.js
          node --check scrapsignal-preview/site/live-signals.js
          grep -q 'Opportunity feed' scrapsignal-preview/site/dashboard-demo.html
          grep -q 'Continue to secure checkout' scrapsignal-preview/site/start.html
          grep -q 'buy.stripe.com/bJeeVc0Sn0Wa2nLgOn2cg00' scrapsignal-preview/site/start.html
          grep -q 'Payment confirmation is processed server-side' scrapsignal-preview/site/welcome.html
          grep -q 'Validated signals from the monitored register' scrapsignal-preview/site/live-signals.js
          grep -q 'Mids Auto Services Limited' scrapsignal-preview/site/signals.json
          grep -q 'Mytum and Selby (Goole) Ltd' scrapsignal-preview/site/signals.json
          grep -q 'Real changes. Source linked. Noise filtered.' scrapsignal-preview/site/proof.html
          grep -q 'Quality first' scrapsignal-preview/site/new-waste-sites-september-2026.html
          grep -q 'Current source-backed proof' scrapsignal-preview/site/digital-waste-tracking-sales-intelligence.html
          grep -q 'The supplier market is crowded' scrapsignal-preview/site/digital-waste-tracking-supplier-market-2026.html
          grep -q 'Global Metal Recycling Ltd' scrapsignal-preview/site/waste-compliance-sales-signals.html
          grep -q 'not evidence that the operator intended to purchase' scrapsignal-preview/site/waste-compliance-sales-signals.html
      - name: Install
        working-directory: scrapsignal-preview
        run: npm install
      - name: Deploy ScrapSignal preview worker
        working-directory: scrapsignal-preview
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify ScrapSignal production
        shell: bash
        run: |
          set -euo pipefail
          base='https://scrapsignal-preview.davidleechristie.workers.dev'
          check(){ local label="$1" body="$2" marker="$3"; if ! grep -q "$marker" <<< "$body"; then echo "VERIFY FAILED: $label missing marker: $marker"; echo "Response preview: ${body:0:500}"; exit 1; fi; echo "verified: $label"; }
          health=$(curl -L -sS --max-time 30 "$base/health")
          check health "$health" 'scrapsignal-preview'
          check durable-analytics "$health" 'durable-kv'
          check customer-store "$health" '"customer_store":"durable-kv"'
          check billing-state "$health" 'payment-link-active'
          metrics=$(curl -L -sS --max-time 30 "$base/api/metrics")
          check metrics-storage "$metrics" '"storage":"kv"'
          check metrics-total "$metrics" '"total"'
          echo "commercial-metrics=$metrics"
          start=$(curl -L -sS --max-time 30 "$base/start")
          check checkout-page "$start" 'Continue to secure checkout'
          check checkout-link "$start" 'buy.stripe.com/bJeeVc0Sn0Wa2nLgOn2cg00'
          checkout=$(curl -sS --max-time 30 -X POST "$base/api/checkout" -H 'content-type: application/json' --data '{}')
          check checkout-api "$checkout" 'stripe-payment-link'
          home=$(curl -L -sS --max-time 30 "$base/")
          check homepage "$home" 'Find businesses that may be'
          check homepage-subscription "$home" 'Founding subscriptions are now open'
          proof=$(curl -L -sS --max-time 30 "$base/proof")
          check proof-page "$proof" 'Real changes. Source linked. Noise filtered.'
          dashboard=$(curl -L -sS --max-time 30 "$base/dashboard-demo")
          check dashboard "$dashboard" 'Opportunity feed'
          check dashboard-live-injection "$dashboard" 'live-signals.js'
          signals=$(curl -L -sS --max-time 30 "$base/signals.json")
          check signals-one "$signals" 'Mids Auto Services Limited'
          check signals-two "$signals" 'Mytum and Selby (Goole) Ltd'
          signalpage=$(curl -L -sS --max-time 30 "$base/signals/new-waste-sites-september-2026")
          check public-signal-page "$signalpage" 'New licensed sites our monitor detected'
          check public-signal-proof "$signalpage" 'Mids Auto Services Limited'
          dwt=$(curl -L -sS --max-time 30 "$base/digital-waste-tracking-sales-intelligence")
          check dwt-live-proof "$dwt" 'Current source-backed proof'
          market=$(curl -L -sS --max-time 30 "$base/digital-waste-tracking-supplier-market-2026")
          check dwt-market "$market" 'The supplier market is crowded'
          compliance=$(curl -L -sS --max-time 30 "$base/waste-compliance-sales-signals")
          check compliance-intelligence "$compliance" 'Global Metal Recycling Ltd'
          check compliance-caveat "$compliance" 'not evidence that the operator intended to purchase'
          sitemap=$(curl -L -sS --max-time 30 "$base/sitemap.xml")
          check sitemap-proof "$sitemap" '/proof'
          livejs=$(curl -L -sS --max-time 30 "$base/live-signals.js")
          check live-feed-renderer "$livejs" 'Validated signals from the monitored register'
          status=$(curl -L -sS --max-time 30 "$base/status.json")
          check validation-state "$status" 'WAIT_FOR_MORE_EVIDENCE'
          check quality-gate "$status" 'quality_gate'
          echo 'ScrapSignal commercial production verification passed.'
