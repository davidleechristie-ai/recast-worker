name: ScrapSignal Cloudflare bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scrapsignal-cloudflare-bridge.yml'
      - 'scrapsignal-preview/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrapsignal-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate dashboard JavaScript
        run: node --check scrapsignal-preview/site/dashboard.js
      - name: Verify dashboard product surface
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Opportunity feed' scrapsignal-preview/site/dashboard-demo.html
          grep -q 'Watchlist' scrapsignal-preview/site/dashboard-demo.html
          grep -q 'Alert settings' scrapsignal-preview/site/dashboard-demo.html
          grep -q 'Export CSV' scrapsignal-preview/site/dashboard-demo.html
          grep -q 'CONFIRMED FACT' scrapsignal-preview/site/dashboard-demo.html
          grep -q 'SCRAPSIGNAL ASSESSMENT' scrapsignal-preview/site/dashboard-demo.html
          grep -q 'function exportCsv' scrapsignal-preview/site/dashboard.js
          grep -q 'localStorage' scrapsignal-preview/site/dashboard.js
          grep -q 'signal_open' scrapsignal-preview/site/dashboard.js
      - name: Install
        working-directory: scrapsignal-preview
        run: npm install
      - name: Deploy ScrapSignal preview worker
        working-directory: scrapsignal-preview
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify ScrapSignal production
        shell: bash
        run: |
          set -euo pipefail
          base='https://scrapsignal-preview.davidleechristie.workers.dev'
          ok=false
          for attempt in 1 2 3 4 5; do
            health=$(curl -L -sS --max-time 30 "$base/health" || true)
            if grep -q 'scrapsignal-preview' <<< "$health"; then ok=true; break; fi
            echo "Awaiting latest Worker version (attempt $attempt): $health"
            sleep 3
          done
          test "$ok" = 'true'
          home=$(curl -L -sS --max-time 30 "$base/")
          grep -q 'Find businesses that may be' <<< "$home"
          grep -q '£149/month' <<< "$home"
          dashboard=$(curl -L -sS --max-time 30 "$base/dashboard-demo")
          grep -q 'FULL INTERACTIVE DEMO' <<< "$dashboard"
          grep -q 'Opportunity feed' <<< "$dashboard"
          grep -q 'Watchlist' <<< "$dashboard"
          grep -q 'Alert settings' <<< "$dashboard"
          js=$(curl -L -sS --max-time 30 "$base/dashboard.js")
          grep -q 'function exportCsv' <<< "$js"
          grep -q 'watchlist_toggle' <<< "$js"
          status=$(curl -L -sS --max-time 30 "$base/status.json")
          grep -q 'BUILD_MVP' <<< "$status"
          echo 'ScrapSignal full dashboard production verification passed.'
