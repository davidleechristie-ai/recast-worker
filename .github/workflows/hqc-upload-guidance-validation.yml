name: HQC upload guidance validation
on:
  pull_request:
    paths:
      - 'hqc-deploy-preview/upload-friction-v3.js'
      - 'hqc-deploy-preview/mobile-homepage-override.js'
      - 'hqc-deploy-preview/approved-home-layout.js'
      - 'hqc-deploy-preview/test/landing-presentation-rendered.mjs'
      - 'hqc-deploy-preview/test/renewable-upload-boundary.test.mjs'
      - '.github/workflows/hqc-upload-guidance-validation.yml'
permissions:
  contents: read
jobs:
  upload-guidance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check hqc-deploy-preview/upload-friction-v3.js
      - name: Verify renewable intake boundary
        working-directory: hqc-deploy-preview
        run: node --test test/renewable-upload-boundary.test.mjs
      - name: Verify explicit picker guidance and retained upload controls
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const s=fs.readFileSync('hqc-deploy-preview/upload-friction-v3.js','utf8');
          assert.match(s,/Select Choose file below to upload your quote/);
          assert.doesNotMatch(s,/Drag and drop files here, or click to browse/);
          assert.match(s,/function openPicker\(/);
          assert.match(s,/input\.click\(\)/);
          console.log('HQC upload guidance checks passed');
          NODE
      - name: Install existing browser test tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render category-correct landing presentation
        run: node hqc-deploy-preview/test/landing-presentation-rendered.mjs
      - name: Retain rendered presentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hqc-landing-presentation
          path: artifacts/landing-presentation
