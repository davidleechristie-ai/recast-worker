name: HQC Cloudflare bridge

on:
  push:
    branches: [main]
    paths:
      - 'hqc-deploy-preview/**'
      - '.github/workflows/hqc-cloudflare-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hqc-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: hqc-deploy-preview
        run: npm install
      - name: Snapshot current HQC frontend
        working-directory: hqc-deploy-preview
        run: node snapshot.mjs
      - name: Deploy HQC preview worker
        working-directory: hqc-deploy-preview
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify HQC preview
        shell: bash
        run: |
          set -euo pipefail
          base='https://hqc-migration-preview.davidleechristie.workers.dev'
          ok=false
          for attempt in 1 2 3 4 5; do
            health=$(curl -L -sS --max-time 30 "$base/health" || true)
            if grep -q 'cloudflare-assets' <<< "$health"; then ok=true; break; fi
            echo "Awaiting latest Worker version (attempt $attempt): $health"
            sleep 3
          done
          test "$ok" = 'true'
          for path in / /api/_healthcheck /robots.txt /resources/homepage-graphic.png /is-this-a-good-heat-pump-quote.html; do
            code=$(curl -L -sS -o /tmp/hqc-check -w '%{http_code}' --max-time 30 "$base$path")
            echo "$path -> $code"
            test "$code" = '200'
          done
          home=$(curl -L -sS --max-time 30 "$base/")
          grep -q 'root' <<< "$home"
          if grep -q 'heat-pump-second-opinion-v43csv.v2.appdeploy.ai' <<< "$home"; then
            echo 'Frontend still references AppDeploy hosting origin'
            exit 1
          fi
          if grep -q 'data-appdeploy-overlay-bootstrap' <<< "$home"; then
            echo 'AppDeploy overlay bootstrap still present'
            exit 1
          fi
          css=$(grep -oE "https://hqc-migration-preview\\.davidleechristie\\.workers\\.dev/assets/[^\"]+\\.css" <<< "$home" | head -1)
          test -n "$css"
          css_code=$(curl -L -sS -o /tmp/hqc-css -w '%{http_code}' --max-time 30 "$css")
          echo "css -> $css_code"
          test "$css_code" = '200'
          api=$(curl -L -sS --max-time 30 "$base/api/_healthcheck")
          echo "api=$api"
          grep -q 'Success' <<< "$api"
          static=$(curl -L -sS --max-time 30 "$base/is-this-a-good-heat-pump-quote.html")
          grep -q 'Is this a good heat-pump quote' <<< "$static"
          echo 'HQC frozen Cloudflare frontend verification passed.'
