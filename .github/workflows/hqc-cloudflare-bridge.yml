name: HQC Cloudflare bridge

on:
  push:
    branches: [main]
    paths:
      - 'hqc-deploy-preview/**'
      - '.github/workflows/hqc-cloudflare-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hqc-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: hqc-deploy-preview
        run: npm install
      - name: Deploy HQC preview worker
        working-directory: hqc-deploy-preview
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
