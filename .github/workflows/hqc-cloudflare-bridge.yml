name: HQC Cloudflare bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hqc-cloudflare-bridge.yml'
      - 'hqc-deploy-preview/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hqc-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: hqc-deploy-preview
        run: npm install
      - name: Snapshot current HQC frontend
        working-directory: hqc-deploy-preview
        run: node snapshot.mjs
      - name: Deploy HQC preview worker
        working-directory: hqc-deploy-preview
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify HQC preview
        shell: bash
        run: |
          set -euo pipefail
          base='https://hqc-migration-preview.davidleechristie.workers.dev'
          ok=false
          for attempt in 1 2 3 4 5; do
            health=$(curl -L -sS --max-time 30 "$base/health" || true)
            if grep -q 'cloudflare-assets' <<< "$health"; then ok=true; break; fi
            echo "Awaiting latest Worker version (attempt $attempt): $health"
            sleep 3
          done
          test "$ok" = 'true'
          for path in / /api/_healthcheck /robots.txt /resources/homepage-graphic.png /is-this-a-good-heat-pump-quote.html /__hqc_enhancements.js /__hqc_target_mobile.js /__hqc_readability.js; do
            code=$(curl -L -sS -o /tmp/hqc-check -w '%{http_code}' --max-time 30 "$base$path")
            echo "$path -> $code"
            test "$code" = '200'
          done
          home=$(curl -L -sS --max-time 30 "$base/")
          grep -q 'root' <<< "$home"
          grep -q '__hqc_enhancements.js' <<< "$home"
          grep -q '__hqc_target_mobile.js' <<< "$home"
          grep -q '__hqc_readability.js' <<< "$home"
          if grep -q 'heat-pump-second-opinion-v43csv.v2.appdeploy.ai' <<< "$home"; then echo 'Frontend still references AppDeploy hosting origin'; exit 1; fi
          if grep -q 'data-appdeploy-overlay-bootstrap' <<< "$home"; then echo 'AppDeploy overlay bootstrap still present'; exit 1; fi
          css_path=$(grep -oE '/assets/[^" ]+\.css' <<< "$home" | head -1 || true)
          test -n "$css_path"
          css_code=$(curl -L -sS -o /tmp/hqc-css -w '%{http_code}' --max-time 30 "$base$css_path")
          echo "css -> $css_code"
          test "$css_code" = '200'
          for asset in __hqc_readability.js __hqc_enhancements.js __hqc_target_mobile.js; do
            headers=$(mktemp)
            curl -L -sS -D "$headers" -o "/tmp/$asset" --max-time 30 "$base/$asset"
            ct=$(tr -d '\r' < "$headers" | awk -F': ' 'tolower($1)=="content-type" {print tolower($2); exit}')
            echo "$asset content-type=$ct"
            grep -Eq 'javascript|ecmascript|text/plain' <<< "$ct"
            local_sha=$(sha256sum "hqc-deploy-preview/site/$asset" | awk '{print $1}')
            live_sha=$(sha256sum "/tmp/$asset" | awk '{print $1}')
            echo "$asset local=$local_sha live=$live_sha"
            test "$local_sha" = "$live_sha"
          done
          api=$(curl -L -sS --max-time 30 "$base/api/_healthcheck")
          echo "api=$api"
          grep -q 'Success' <<< "$api"
          static=$(curl -L -sS --max-time 30 "$base/is-this-a-good-heat-pump-quote.html")
          grep -q 'Is this a good heat-pump quote' <<< "$static"
          echo 'HQC Cloudflare readability/commercial preview verification passed.'
      - name: Inspect current HQC production routing
        shell: bash
        run: |
          set -u
          echo '--- DNS A/AAAA/CNAME ---'
          dig +short homequotecheck.co.uk A || true
          dig +short homequotecheck.co.uk AAAA || true
          dig +short homequotecheck.co.uk CNAME || true
          echo '--- HTTPS headers ---'
          curl -sS -I -L --max-time 30 https://homequotecheck.co.uk/ | sed -n '1,30p' || true
      - name: Inspect Cloudflare zone ownership
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          zone=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones?name=homequotecheck.co.uk&account.id=$CLOUDFLARE_ACCOUNT_ID")
          echo "$zone" | jq '{success,errors,zones:[.result[]? | {id,name,status,name_servers}]}'
          zone_id=$(echo "$zone" | jq -r '.result[0].id // empty')
          if [ -n "$zone_id" ]; then
            echo "HQC_ZONE_ID=$zone_id"
            dns=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=homequotecheck.co.uk")
            echo "$dns" | jq '{success,errors,records:[.result[]? | {id,type,name,content,proxied,ttl}]}'
          else
            echo 'HQC zone not found in this Cloudflare account.'
          fi
