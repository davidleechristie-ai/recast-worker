name: Recast workflow usability audit

on:
  push:
    branches:
      - workflow-usability-audit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workflow-usability-audit
  cancel-in-progress: true

jobs:
  audit_improve_release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v5
        with:
          ref: workflow-usability-audit
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recast-worker/package-lock.json

      - name: Install dependencies
        working-directory: recast-worker
        run: npm ci --no-audit --no-fund

      - name: Full regression suite
        working-directory: recast-worker
        run: npm test

      - name: Workflow usability regression checks
        working-directory: recast-worker
        run: node src/workflow-usability.test.mjs

      - name: Wrangler build validation
        working-directory: recast-worker
        run: npx wrangler deploy --dry-run

      - name: Guard audit scope
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(\.github/recast-workflow-usability\.md|\.github/workflows/workflow-usability-audit\.yml|recast-worker/public/workflow-usability\.css|recast-worker/public/workflow-usability\.js|recast-worker/src/worker-ui-integrity\.js|recast-worker/src/workflow-usability\.test\.mjs)$'
          changed=$(git diff --name-only origin/main...HEAD)
          echo "$changed" >> "$GITHUB_STEP_SUMMARY"
          bad=$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "Unexpected files in workflow-usability release scope:"
            echo "$bad"
            exit 1
          fi

      - name: Remove one-off audit harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "recast-usability-release[bot]"
          git config user.email "recast-usability-release[bot]@users.noreply.github.com"
          git rm .github/recast-workflow-usability.md .github/workflows/workflow-usability-audit.yml
          git commit -m "Remove one-off workflow usability audit harness"

      - name: Rebase onto latest main and rerun gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          cd recast-worker
          npm test
          node src/workflow-usability.test.mjs
          npx wrangler deploy --dry-run

      - name: Release to main
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
          echo "Workflow usability changes passed the release gate and were pushed to main. Existing Deploy Recast production workflow will deploy falling-cloud-0deb." >> "$GITHUB_STEP_SUMMARY"
