name: Recast workflow usability audit

on:
  push:
    branches:
      - workflow-usability-audit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workflow-usability-audit
  cancel-in-progress: true

jobs:
  audit_improve_release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v5
        with:
          ref: workflow-usability-audit
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recast-worker/package-lock.json

      - name: Install dependencies
        working-directory: recast-worker
        run: npm ci --no-audit --no-fund

      - name: Baseline regression suite
        working-directory: recast-worker
        run: npm test

      - name: Select best available model
        id: model
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/astra-model.json -w '%{http_code}' \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            https://api.openai.com/v1/models/gpt-6-astra || true)
          if [ "$code" = "200" ]; then
            echo "selected=gpt-6-astra" >> "$GITHUB_OUTPUT"
          else
            echo "selected=gpt-5.6-sol" >> "$GITHUB_OUTPUT"
          fi

      - name: Run workflow usability agent
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt-file: '.github/recast-workflow-usability.md'
          model: ${{ steps.model.outputs.selected }}
          effort: 'high'
          codex-args: '["--config","web_search=\"live\""]'
          safety-strategy: 'drop-sudo'
          allow-bots: 'true'

      - name: Publish audit report
        if: always()
        shell: bash
        run: |
          {
            echo "# Recast Workflow / Recipe Usability Audit"
            echo
            echo "**Model selected:** ${{ steps.model.outputs.selected || 'not reached' }}"
            echo
            if [ -s /tmp/recast-workflow-usability-report.md ]; then
              cat /tmp/recast-workflow-usability-report.md
            else
              echo "The agent did not produce the required report. Review the preceding step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guard audit scope
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git status --porcelain | awk '{print $2}' | grep '^\.github/' | grep -v '^\.github/recast-workflow-usability.md$' | grep -v '^\.github/workflows/workflow-usability-audit.yml$' || true)
          if [ -n "$bad" ]; then
            echo "Agent modified protected workflow/config files:"
            echo "$bad"
            exit 1
          fi

      - name: Release regression suite
        working-directory: recast-worker
        run: npm test

      - name: Wrangler build validation
        working-directory: recast-worker
        run: npx wrangler deploy --dry-run

      - name: Commit justified product changes
        id: product
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- recast-worker)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No justified product change was produced; production will not be redeployed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "recast-usability-agent[bot]"
          git config user.email "recast-usability-agent[bot]@users.noreply.github.com"
          git add recast-worker
          git commit -m "Improve workflow and recipe builder usability"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Remove one-off audit harness
        if: steps.product.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/recast-workflow-usability.md .github/workflows/workflow-usability-audit.yml
          git commit -m "Remove one-off workflow usability audit harness"

      - name: Rebase onto latest main and rerun gate
        if: steps.product.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          cd recast-worker
          npm test
          npx wrangler deploy --dry-run

      - name: Release to main
        if: steps.product.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
          echo "Product changes pushed to main. Existing Deploy Recast production workflow will deploy falling-cloud-0deb." >> "$GITHUB_STEP_SUMMARY"
