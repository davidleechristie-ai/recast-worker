name: ScrapSignal KV bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/scrapsignal-kv-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        working-directory: scrapsignal-preview
        run: npm install
      - name: Create durable commercial-event namespace
        working-directory: scrapsignal-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler kv namespace create scrapsignal-commercial-events
