name: Deploy Recast Worker

on:
  push:
    branches: [main]
    paths:
      - 'recast-worker/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: deploy-falling-cloud-0deb
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release
        uses: actions/checkout@v4
      - name: Deploy falling-cloud-0deb
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: recast-worker
          command: deploy
