name: HQC production cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hqc-production-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hqc-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: hqc-deploy-preview
        run: npm install
      - name: Snapshot HQC for production domain
        working-directory: hqc-deploy-preview
        env:
          HQC_PUBLIC_ORIGIN: https://homequotecheck.co.uk
        run: node snapshot.mjs
      - name: Deploy production Worker and verify or roll back
        working-directory: hqc-deploy-preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo 'Deploying HQC production Worker custom domain...'
          npx wrangler deploy --config wrangler.production.toml
          verify=false
          for attempt in 1 2 3 4 5 6; do
            echo "Production verification attempt $attempt"
            health_code=$(curl -L -sS -o /tmp/hqc-health -w '%{http_code}' --max-time 30 https://homequotecheck.co.uk/health || true)
            home_code=$(curl -L -sS -o /tmp/hqc-home -w '%{http_code}' --max-time 30 https://homequotecheck.co.uk/ || true)
            api_code=$(curl -L -sS -o /tmp/hqc-api -w '%{http_code}' --max-time 30 https://homequotecheck.co.uk/api/_healthcheck || true)
            static_code=$(curl -L -sS -o /tmp/hqc-static -w '%{http_code}' --max-time 30 https://homequotecheck.co.uk/is-this-a-good-heat-pump-quote.html || true)
            echo "health=$health_code home=$home_code api=$api_code static=$static_code"
            if [ "$health_code" = '200' ] && [ "$home_code" = '200' ] && [ "$api_code" = '200' ] && [ "$static_code" = '200' ] \
              && grep -q 'cloudflare-assets' /tmp/hqc-health \
              && grep -q 'Success' /tmp/hqc-api \
              && grep -q '__hqc_enhancements.js' /tmp/hqc-home \
              && ! grep -q 'data-appdeploy-overlay-bootstrap' /tmp/hqc-home \
              && grep -q 'Is this a good heat-pump quote' /tmp/hqc-static; then
              verify=true
              break
            fi
            sleep 5
          done
          if [ "$verify" != 'true' ]; then
            echo 'Production verification failed; removing HQC production custom-domain binding.'
            npx wrangler deploy --config wrangler.production-rollback.toml || true
            echo 'Checking AppDeploy fallback after rollback...'
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -L -sS -o /tmp/hqc-rollback -w '%{http_code}' --max-time 30 https://homequotecheck.co.uk/ || true)
              if [ "$code" = '200' ]; then
                echo 'Fallback host is responding after rollback.'
                break
              fi
              sleep 5
            done
            exit 1
          fi
          css_path=$(grep -oE '/assets/[^" ]+\.css' /tmp/hqc-home | head -1)
          js_path=$(grep -oE '/assets/[^" ]+\.js' /tmp/hqc-home | head -1)
          test -n "$css_path"
          test -n "$js_path"
          test "$(curl -L -sS -o /tmp/hqc-css -w '%{http_code}' --max-time 30 "https://homequotecheck.co.uk$css_path")" = '200'
          test "$(curl -L -sS -o /tmp/hqc-js -w '%{http_code}' --max-time 30 "https://homequotecheck.co.uk$js_path")" = '200'
          echo 'HQC production cutover passed all verification gates.'
