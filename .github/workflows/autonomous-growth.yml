name: Recast autonomous daily growth

# Updating this workflow intentionally triggers a self-test run on main.
# Self-test marker: prefer GPT-6 Astra, automatically fall back to GPT-5.6 Sol until Astra API access reaches this key; publish a management report every run.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/autonomous-growth.yml'
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: recast-autonomous-growth
  cancel-in-progress: true

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 20
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recast-worker/package-lock.json
      - name: Install dependencies
        working-directory: recast-worker
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund
      - name: Baseline test suite
        working-directory: recast-worker
        run: npm test
      - name: Refresh authoritative growth scoreboard
        working-directory: recast-worker
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PRICE_MAP: '{"price_1U41Bw07vRRG7JsXH0iAKy7g":"pro_monthly","price_1U41Bx07vRRG7JsXlwnms0uo":"pro_yearly","price_1U41Bs07vRRG7JsXnYpcoHh1":"api_monthly","price_1U41Br07vRRG7JsXV1vskFmE":"api_yearly","price_1U4Kub07vRRG7JsXtMatleol":"day_pass"}'
        run: node scripts/refresh-growth-scoreboard.mjs
      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY repository secret is required for the autonomous growth agent."; exit 1; fi
      - name: Select best available OpenAI model
        id: model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/astra-model.json -w '%{http_code}' \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            https://api.openai.com/v1/models/gpt-6-astra || true)"
          if [ "$status" = "200" ]; then
            echo "selected=gpt-6-astra" >> "$GITHUB_OUTPUT"
            echo "GPT-6 Astra is available to this API key; using Astra."
          else
            echo "selected=gpt-5.6-sol" >> "$GITHUB_OUTPUT"
            echo "GPT-6 Astra is not yet available to this API key (HTTP $status); using GPT-5.6 Sol for this run."
          fi
      - name: Run Recast growth agent
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt-file: '.github/recast-daily-growth.md'
          model: ${{ steps.model.outputs.selected }}
          effort: 'high'
          codex-args: '["--config","web_search=\"live\""]'
          safety-strategy: 'drop-sudo'
          allow-bots: 'true'
      - name: Publish growth agent report
        if: always()
        shell: bash
        run: |
          {
            echo "# Recast Growth Agent Report"
            echo
            echo "**Run:** $GITHUB_RUN_NUMBER"
            echo "**Model selected:** ${{ steps.model.outputs.selected || 'not reached' }}"
            echo "**Workflow:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if [ -s /tmp/recast-growth-report.md ]; then
              cat /tmp/recast-growth-report.md
            else
              echo "## Executive summary"
              echo "The agent did not produce its management report file. Review the failed or interrupted workflow step above."
              echo
              echo "## Risks / blockers"
              echo "The run ended before the reporting contract completed, so findings and suggestions may be incomplete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce autonomous scope
        run: node recast-worker/guard-autonomous-diff.mjs
      - name: Validate growth scoreboard
        run: node -e "JSON.parse(require('fs').readFileSync('recast-worker/GROWTH_SCOREBOARD.json','utf8')); console.log('Growth scoreboard JSON valid')"
      - name: Test proposed changes
        working-directory: recast-worker
        run: npm test
      - name: Commit safe change
        id: commit
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No justified change today."; exit 0; fi
          git config user.name "recast-growth-bot"
          git config user.email "recast-growth-bot@users.noreply.github.com"
          git add recast-worker/public recast-worker/AUTONOMOUS_GROWTH_LOG.md recast-worker/GROWTH_SCOREBOARD.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Automated daily Recast growth improvement"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch production deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-exact-release.yml --ref main
      - name: Summary
        if: always()
        run: |
          echo "Growth model: ${{ steps.model.outputs.selected || 'not reached' }}"
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "Authoritative metrics refreshed; safe metric-driven acquisition change committed to main and production deployment explicitly dispatched."
          else
            echo "Agent run completed without a production-facing commit, or stopped before the commit stage. See the published management report in the workflow summary."
          fi
