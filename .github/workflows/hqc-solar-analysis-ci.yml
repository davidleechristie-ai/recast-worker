name: HQC Solar analysis CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hqc-solar-analysis-ci.yml'
      - 'hqc-deploy-preview/lib/solar-battery-*.js'
      - 'hqc-deploy-preview/lib/technology-routing.js'
      - 'hqc-deploy-preview/lib/analysis-request-routing.js'
      - 'hqc-deploy-preview/test/solar-battery-*.mjs'
      - 'hqc-deploy-preview/test/technology-routing.test.mjs'
      - 'hqc-deploy-preview/test/analysis-request-routing.test.mjs'
      - 'hqc-deploy-preview/test/fixtures/solar-battery-cases.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify executable Solar analysis
        working-directory: hqc-deploy-preview
        run: node --test test/solar-battery-analysis.test.mjs
      - name: Verify Solar extraction and evidence contracts
        working-directory: hqc-deploy-preview
        run: node --test test/solar-battery-extraction.test.mjs test/solar-battery-evidence.test.mjs test/solar-battery-fixture-contract.test.mjs
      - name: Verify technology isolation
        working-directory: hqc-deploy-preview
        run: node --test test/technology-routing.test.mjs test/analysis-request-routing.test.mjs
