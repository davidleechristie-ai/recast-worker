name: HQC release intake regression
on:
  pull_request:
    paths:
      - 'hqc-deploy-preview/test/intake-diagnostics.test.mjs'
      - '.github/workflows/hqc-intake-regression.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hqc-deploy-preview/test/intake-diagnostics.test.mjs
