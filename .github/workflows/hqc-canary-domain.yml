name: HQC custom-domain canary

on:
  push:
    branches: [main]
    paths:
      - 'hqc-deploy-preview/**'
      - '.github/workflows/hqc-canary-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hqc-custom-domain-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: hqc-deploy-preview
        run: npm install
      - name: Snapshot HQC frontend for canary hostname
        working-directory: hqc-deploy-preview
        run: node snapshot.mjs
        env:
          HQC_PUBLIC_ORIGIN: https://cf-preview.homequotecheck.co.uk
      - name: Bind safe HQC canary custom domain
        working-directory: hqc-deploy-preview
        run: npx wrangler deploy --config wrangler.canary.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify canary domain
        shell: bash
        run: |
          set -euo pipefail
          base='https://cf-preview.homequotecheck.co.uk'
          ok=false
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -L -sS -o /tmp/canary -w '%{http_code}' --max-time 30 "$base/health" || true)
            body=$(cat /tmp/canary 2>/dev/null || true)
            echo "attempt $attempt -> $code $body"
            if [ "$code" = '200' ] && grep -q 'hqc-migration-preview' <<< "$body"; then ok=true; break; fi
            sleep 5
          done
          test "$ok" = 'true'
          home=$(curl -L -sS --max-time 30 "$base/")
          grep -q '__hqc_enhancements.js' <<< "$home"
          grep -q '__hqc_upload_v3.js' <<< "$home"
          if grep -q 'hqc-migration-preview.davidleechristie.workers.dev' <<< "$home"; then
            echo 'Canary frontend contains workers.dev public URLs'
            exit 1
          fi
          if grep -q 'heat-pump-second-opinion-v43csv.v2.appdeploy.ai' <<< "$home"; then
            echo 'Canary frontend exposes an obsolete AppDeploy frontend URL'
            exit 1
          fi
          enhancement=$(curl -L -sS --max-time 30 "$base/__hqc_enhancements.js")
          grep -q 'Quote evidence completeness' <<< "$enhancement"
          grep -q 'Choose screenshot / photo' <<< "$enhancement"
          grep -q 'Enter figures manually' <<< "$enhancement"
          uploadfix=$(curl -L -sS --max-time 30 "$base/__hqc_upload_v3.js")
          grep -q 'upload-friction-v3' <<< "$uploadfix"
          grep -q 'input\[type="file"\]' <<< "$uploadfix"
          grep -q 'Enter quote figures manually' <<< "$uploadfix"
          api=$(curl -L -sS --max-time 30 "$base/api/_healthcheck")
          grep -q 'Success' <<< "$api"
          qa_headers=$(mktemp)
          curl -sS --max-time 30 -D "$qa_headers" -o /tmp/qa-event -X POST "$base/api/event" -H 'content-type: application/json' --data '{"event":"landing_view","source":"qa_canary_guard","analysisId":"","quoteCount":0,"provenance":"","isTest":false}'
          grep -qi '^x-hqc-qa-event: excluded' "$qa_headers"
          growth=$(curl -L -sS --max-time 30 "$base/api/growth-report")
          ! grep -q 'qa_canary_guard' <<< "$growth"
          echo 'HQC canary QA-event exclusion verified.'
          static=$(curl -L -sS --max-time 30 "$base/is-this-a-good-heat-pump-quote.html")
          grep -q 'Is this a good heat-pump quote' <<< "$static"
          echo 'HQC custom-domain canary passed: health, API proxy and current enhancement bundle verified.'
      - name: Verify quote selection advances intake in mobile browser
        working-directory: hqc-deploy-preview
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('https://cf-preview.homequotecheck.co.uk/?qa=1',{waitUntil:'networkidle',timeout:60000});
          const start=page.getByRole('button',{name:/check my quote/i}).first();
          await start.waitFor({state:'visible',timeout:15000});
          await start.click();
          const choose=page.locator('#hqc-choose-file');
          await choose.waitFor({state:'visible',timeout:15000});
          const inputs=await page.locator('input[type="file"]').count();
          if(inputs<1) throw new Error('Quote intake exposes no file input');
          const chooserPromise=page.waitForEvent('filechooser',{timeout:5000});
          await choose.click();
          const chooser=await chooserPromise;
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl2+XkAAAAASUVORK5CYII=','base64');
          await chooser.setFiles({name:'qa-heat-pump-quote.png',mimeType:'image/png',buffer:png});
          const next=page.getByRole('button',{name:/continue/i}).first();
          await next.waitFor({state:'visible',timeout:10000});
          await next.click();
          await page.getByRole('heading',{name:/Ready to analyse|Tell us about your home/i}).waitFor({state:'visible',timeout:10000});
          if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
          await browser.close();
          console.log('HQC canary native file acceptance + intake progression test passed.');
          NODE
