name: HQC custom-domain canary

on:
  push:
    branches: [main]
    paths:
      - 'hqc-deploy-preview/**'
      - '.github/workflows/hqc-canary-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hqc-custom-domain-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: hqc-deploy-preview
        run: npm install
      - name: Snapshot HQC frontend for canary hostname
        working-directory: hqc-deploy-preview
        run: node snapshot.mjs
        env:
          HQC_PUBLIC_ORIGIN: https://cf-preview.homequotecheck.co.uk
      - name: Bind safe HQC canary custom domain
        working-directory: hqc-deploy-preview
        run: npx wrangler deploy --config wrangler.canary.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify canary domain
        shell: bash
        run: |
          set -euo pipefail
          base='https://cf-preview.homequotecheck.co.uk'
          ok=false
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -L -sS -o /tmp/canary -w '%{http_code}' --max-time 30 "$base/health" || true)
            body=$(cat /tmp/canary 2>/dev/null || true)
            echo "attempt $attempt -> $code $body"
            if [ "$code" = '200' ] && grep -q 'hqc-migration-preview' <<< "$body"; then ok=true; break; fi
            sleep 5
          done
          test "$ok" = 'true'
          home=$(curl -L -sS --max-time 30 "$base/")
          grep -q '__hqc_enhancements.js' <<< "$home"
          if grep -q 'hqc-migration-preview.davidleechristie.workers.dev' <<< "$home"; then
            echo 'Canary frontend contains workers.dev public URLs'
            exit 1
          fi
          if grep -q 'heat-pump-second-opinion-v43csv.v2.appdeploy.ai' <<< "$home"; then
            echo 'Canary frontend exposes an obsolete AppDeploy frontend URL'
            exit 1
          fi
          enhancement=$(curl -L -sS --max-time 30 "$base/__hqc_enhancements.js")
          grep -q 'Quote evidence completeness' <<< "$enhancement"
          grep -q 'upload-friction-v2' <<< "$enhancement"
          grep -q 'Choose screenshot / photo' <<< "$enhancement"
          grep -q 'Enter figures manually' <<< "$enhancement"
          api=$(curl -L -sS --max-time 30 "$base/api/_healthcheck")
          grep -q 'Success' <<< "$api"
          echo 'HQC custom-domain canary passed: health, API proxy and current enhancement bundle verified.'
