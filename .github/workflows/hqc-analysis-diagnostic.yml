name: HQC analysis-boundary diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hqc-analysis-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture stylesheet boundary diagnostic
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics
          report="diagnostics/hqc-stylesheet-diagnostic.txt"
          : > "$report"
          for base in 'https://heat-pump-second-opinion-v43csv.v2.appdeploy.ai' 'https://homequotecheck.co.uk'; do
            echo "=== $base ===" | tee -a "$report"
            curl -L -sS --max-time 30 -D "$RUNNER_TEMP/headers.txt" "$base/?stylesheet_probe=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/home.html" || true
            echo 'HOME_HEADERS' | tee -a "$report"
            cat "$RUNNER_TEMP/headers.txt" | tee -a "$report"
            python - "$base" "$RUNNER_TEMP/home.html" "$report" <<'PY'
          import pathlib,re,sys,urllib.parse,subprocess
          base,html_path,report_path=sys.argv[1:]
          html=pathlib.Path(html_path).read_text(errors='replace') if pathlib.Path(html_path).exists() else ''
          refs=[]
          for tag in re.findall(r'<link\b[^>]*>',html,re.I):
              if re.search(r'\brel=["\'][^"\']*stylesheet',tag,re.I):
                  m=re.search(r'\bhref=["\']([^"\']+)',tag,re.I)
                  if m: refs.append(m.group(1))
          with open(report_path,'a',encoding='utf-8') as f:
              f.write('STYLESHEETS '+repr(refs)+'\n')
          for ref in refs:
              url=urllib.parse.urljoin(base+'/',ref)
              p=subprocess.run(['curl','-L','-sS','--max-time','30','-o','/tmp/css-body','-D','/tmp/css-head','-w','%{http_code} %{content_type} %{size_download}',url],capture_output=True,text=True)
              body=pathlib.Path('/tmp/css-body').read_text(errors='replace')[:120] if pathlib.Path('/tmp/css-body').exists() else ''
              heads=pathlib.Path('/tmp/css-head').read_text(errors='replace') if pathlib.Path('/tmp/css-head').exists() else ''
              with open(report_path,'a',encoding='utf-8') as f:
                  f.write(f'CSS {url} => {p.stdout.strip()}\n')
                  f.write(heads+'\n')
                  f.write('BODY_PREFIX '+repr(body)+'\n')
          PY
          done
          cat "$report"
      - name: Persist stylesheet diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/hqc-stylesheet-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update HQC stylesheet diagnostic'
            git push
          fi
      - name: Diagnose analysis request and result boundary
        working-directory: hqc-deploy-preview
        shell: bash
        run: |
          set -euo pipefail
          echo 'METRICS_BEFORE'
          curl -fsSL --max-time 30 'https://homequotecheck.co.uk/api/metrics'
          echo
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const page=await context.newPage();
          const requests=[];
          const responses=[];
          const consoleErrors=[];
          page.on('request',r=>{if(['fetch','xhr'].includes(r.resourceType())) requests.push({method:r.method(),resourceType:r.resourceType(),url:r.url()});});
          page.on('response',r=>{const req=r.request();if(['fetch','xhr'].includes(req.resourceType())) responses.push({status:r.status(),resourceType:req.resourceType(),url:r.url()});});
          page.on('pageerror',e=>consoleErrors.push(String(e)));
          await page.goto('https://cf-preview.homequotecheck.co.uk/?qa=1&analysis_boundary=2',{waitUntil:'networkidle',timeout:60000});
          const start=page.getByRole('button',{name:/check my quote/i}).first();
          await start.waitFor({state:'visible',timeout:15000});
          await start.click();
          const choose=page.locator('#hqc-choose-file');
          await choose.waitFor({state:'visible',timeout:15000});
          const chooserPromise=page.waitForEvent('filechooser',{timeout:5000});
          await choose.click();
          const chooser=await chooserPromise;
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl2+XkAAAAASUVORK5CYII=','base64');
          await chooser.setFiles({name:'qa-analysis-boundary.png',mimeType:'image/png',buffer:png});
          await page.getByRole('heading',{name:/Ready to analyse|Tell us about your home/i}).waitFor({state:'visible',timeout:15000});
          const analyse=page.getByRole('button',{name:/Analyse my quote/i}).first();
          await analyse.waitFor({state:'visible',timeout:10000});
          await analyse.click();
          await page.waitForTimeout(12000);
          console.log('FETCH_XHR_REQUESTS',JSON.stringify(requests));
          console.log('FETCH_XHR_RESPONSES',JSON.stringify(responses));
          console.log('PAGE_ERRORS',JSON.stringify(consoleErrors));
          console.log('AFTER_ANALYSE_TEXT',(await page.locator('body').innerText()).slice(0,5000));
          const results=await page.locator('.resultsTop,.facts.panel,.questions').count();
          console.log('RESULT_MARKERS',results);
          await context.close();
          await browser.close();
          NODE
          echo 'METRICS_AFTER'
          curl -fsSL --max-time 30 'https://homequotecheck.co.uk/api/metrics'
          echo
