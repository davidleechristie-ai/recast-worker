name: Workflow docs sync check

on:
  push:
    branches:
      - sync-howto-demo-workflow-ui

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recast-worker/package-lock.json
      - name: Install dependencies
        working-directory: recast-worker
        run: npm ci --no-audit --no-fund
      - name: Full regression suite
        working-directory: recast-worker
        run: npm test
      - name: Workflow docs sync regression checks
        working-directory: recast-worker
        run: node src/workflow-docs-sync.test.mjs
      - name: Wrangler build validation
        working-directory: recast-worker
        run: npx wrangler deploy --dry-run
