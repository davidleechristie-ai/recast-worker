name: Ad-hoc UI consistency

on:
  push:
    branches:
      - adhoc-ui-consistency
      - growth-rendered-visual-gate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adhoc-ui-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: recast-worker
        run: npm ci --no-audit --no-fund
      - name: Full regression and structural UI consistency tests
        working-directory: recast-worker
        run: npm test
      - name: Wrangler build validation
        working-directory: recast-worker
        run: npx wrangler deploy --dry-run
      - name: Confirm UI assets and wrapper
        working-directory: recast-worker
        run: |
          test -f public/ui-consistency.css
          test -f public/ui-consistency.js
          test -f src/worker-ui.js
          grep -q 'src/worker-ui.js' wrangler.jsonc
      - name: Install Playwright Chromium
        working-directory: recast-worker
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Rendered production visual integrity sweep
        working-directory: recast-worker
        env:
          RECAST_VISUAL_BASE_URL: https://tryrecast.app
        run: node scripts/rendered-visual-integrity.mjs
