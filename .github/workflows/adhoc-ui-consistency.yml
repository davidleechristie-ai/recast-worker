name: Ad-hoc UI consistency

on:
  push:
    branches:
      - adhoc-ui-consistency
      - growth-rendered-visual-gate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adhoc-ui-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: recast-worker
        run: npm ci --no-audit --no-fund
      - name: Full regression and structural UI consistency tests
        working-directory: recast-worker
        run: npm test
      - name: Wrangler build validation
        working-directory: recast-worker
        run: npx wrangler deploy --dry-run
      - name: Confirm UI assets and wrapper
        working-directory: recast-worker
        run: |
          test -f public/ui-consistency.css
          test -f public/ui-consistency.js
          test -f src/worker-ui.js
          node - <<'NODE'
          const fs = require('fs');
          const wrangler = fs.readFileSync('wrangler.jsonc', 'utf8');
          const main = wrangler.match(/"main"\s*:\s*"src\/([^"]+)"/);
          if (!main) throw new Error('Wrangler main entry not found');
          let active = main[1];
          let reachedUi = active === 'worker-ui.js';
          for (let depth = 0; !reachedUi && depth < 8; depth += 1) {
            const source = fs.readFileSync(`src/${active}`, 'utf8');
            const lower = source.match(/from ['"]\.\/(worker-[^'"]+\.js)['"]/);
            if (!lower) throw new Error(`${active} does not delegate to a lower worker wrapper`);
            active = lower[1];
            reachedUi = active === 'worker-ui.js';
          }
          if (!reachedUi) throw new Error('Active Worker wrapper chain does not preserve worker-ui.js');
          console.log('Active Worker wrapper chain preserves worker-ui.js');
          NODE
      - name: Install Playwright Chromium
        working-directory: recast-worker
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Rendered production visual integrity sweep
        working-directory: recast-worker
        env:
          RECAST_VISUAL_BASE_URL: https://tryrecast.app
        run: node scripts/rendered-visual-integrity.mjs
