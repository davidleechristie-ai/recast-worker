name = "hqc-production"
main = "worker.js"
compatibility_date = "2026-09-08"
workers_dev = true
keep_vars = true
routes = [
  { pattern = "homequotecheck.co.uk", custom_domain = true }
]

[vars]
HQC_ENV = "production"
STRIPE_DECISION_PACK_PRICE_ID = "price_1UER4fCnmTy7aZ0Hp1zMfDYT"

[secrets]
required = ["STRIPE_SECRET_KEY", "STRIPE_WEBHOOK_SECRET"]

[[durable_objects.bindings]]
name = "HQC_METRICS"
class_name = "HqcMetrics"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HqcMetrics"]

[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "single-page-application"
