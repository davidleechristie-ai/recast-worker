<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter — embeddable widget | Recast</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #0E2338; color: #EDF3F8; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; padding: 14px;
  }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .toolbar button {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px;
    padding: 6px 12px; border-radius: 3px; cursor: pointer; border: 1px solid transparent;
  }
  .btn-gold { background: #F2C14E; color: #0E2338; font-weight: 600; }
  .btn-ghost { background: transparent; color: #B9CBDA; border-color: rgba(140,182,214,0.32); }
  .status { margin-left: auto; font-family: ui-monospace, monospace; font-size: 11.5px; }
  .status.ok { color: #7FE7D0; }
  .status.err { color: #F2846B; }
  textarea {
    flex: 1; min-height: 160px; background: #12314C; color: #EDF3F8;
    border: 1px solid rgba(140,182,214,0.2); border-radius: 4px; padding: 12px;
    font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 13px; line-height: 1.5;
    resize: vertical; width: 100%;
  }
  .footer { display: flex; justify-content: flex-end; margin-top: 10px; }
  .footer a {
    font-family: ui-monospace, monospace; font-size: 11px; color: #7FE7D0;
    text-decoration: none; display: flex; align-items: center; gap: 5px;
  }
  .footer a:hover { color: #F2C14E; }
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn-gold" id="formatBtn">Format</button>
  <button class="btn-ghost" id="minifyBtn">Minify</button>
  <button class="btn-ghost" id="copyBtn">Copy</button>
  <span class="status" id="status"></span>
</div>

<textarea id="editor" spellcheck="false">{"id":1,"name":"Ada Lovelace","tags":["engineer","mathematician"]}</textarea>

<div class="footer">
  <a href="https://tryrecast.app/tools/json-formatter.html" target="_blank" rel="noopener">⇄ Powered by Recast</a>
</div>

<script>
(function () {
  var editor = document.getElementById('editor');
  var status = document.getElementById('status');

  function setStatus(msg, ok) {
    status.textContent = msg;
    status.className = 'status ' + (ok ? 'ok' : 'err');
  }

  document.getElementById('formatBtn').addEventListener('click', function () {
    try {
      editor.value = JSON.stringify(JSON.parse(editor.value), null, 2);
      setStatus('\u2713 Formatted', true);
    } catch (e) {
      setStatus('\u2715 ' + e.message, false);
    }
  });

  document.getElementById('minifyBtn').addEventListener('click', function () {
    try {
      editor.value = JSON.stringify(JSON.parse(editor.value));
      setStatus('\u2713 Minified', true);
    } catch (e) {
      setStatus('\u2715 ' + e.message, false);
    }
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    if (navigator.clipboard) navigator.clipboard.writeText(editor.value);
    setStatus('\u2713 Copied', true);
  });
})();
</script>

</body>
</html>
